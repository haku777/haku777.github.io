<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vocabulary</title>
        <style>
                *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{
            background: #f2f1f1;
            height: 100vh;
            overflow: hidden;
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
        }

        header{
            width: 70vw;
            font-size: 3vh;
            margin: auto;
        }

        header fieldset{
            border: 2px solid #7a6795;
            border-radius: 7px;
            padding: 10px;
        }

        legend code{
            font-weight: bold;
            font-size: 3vw;
        }

        .wrapper .main{
            box-shadow: 0px 0px 17px #d1d1d1;
            margin: auto;
            margin-top: 7vh;
            width: 80vw;
        }

        section{
            margin: auto;
        }

        .section2 h3{
            font-size: 4vh !important;
        }
        .section2 article:nth-child(2){
            background: crimson !important;
        }

        article{
            padding: 4px;
            display: flex;
            font-size: 7vw;
            justify-content: center;
            overflow: hidden;
            text-align: center;
            align-items: center;
            align-content: center;
        }

        article h3{
            word-break: normal;
        }

        code{
            color: #36ae56;
        }

        h1,h2{
            color: slateblue;
        }

        h3:nth-child(2){
            color: slateblue;
            word-wrap: break-all;
            word-wrap: break-word;
        }

        h3:nth-child(1){
            color: #272727;
        }

        footer{
            padding-top: 20px;
            color: gray;
            text-align: center;
        }

        .dark-mode {
            background-color: #000;
            & .main{
                border: 1px solid #333;
                box-shadow: none;
            }
            & article{
                background-color: #000 !important;
            }
            & article:nth-child(2){
                background: #3fbf7f !important;
            }
            & h4,label{
                background-color: #000 !important;
                color: #cecece;
            }
        }

        @media (max-width: 750px){
            article{
                font-size: 7vw;
            }
            h1,h4,label{
                font-size: 4vw;
            }
            code{
                font-size: 2.7vw;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>VOCABULARY</h1>
        <fieldset>
            <legend>
                <code>Remember Words</code>
            </legend>
            <h4>These words change automatically every five seconds</h4>
            <input type="checkbox" name="light" id="light"><label for="light">Dark Mode</label>
        </fieldset>
    </header>
    
    <div class="wrapper">
        <div class="main">
            <div class="data">
                <section>
                    <article>
                        <h3 id="id" hidden></h3>
                        <h3 id="word">WORD</h3>
                    </article>

                    <article>
                        <h3 id="definition">MEANING</h3>
                    </article>
                </section>
                <br><br><br><br>
                <section class="section2">
                    <article>
                        <h3 id="id" hidden></h3>
                        <h3 id="word2" style="color: crimson;">WORD</h3>
                    </article>

                    <article style="background: crimson !important;">
                        <h3 id="definition2" style="color:#fff !important;">MEANING</h3>
                    </article>
                </section>
            </div>
        </div>
    </div>
    
    <footer>
        <code>CREATE BY JIMMY YAHIR GUTIERREZ (HAKU BISHAMON)</code>
    </footer>
</body>

<script>
    
    (() =>{ 
        let Word = document.querySelector("#word");
        let Meaning = document.querySelector("#definition");

        let Word2 = document.querySelector("#word2");
        let Meaning2 = document.querySelector("#definition2");

        let Data = null;
        let count = 0;

        // fetch('/api/getwords')
        // fetch('http://localhost:777/api/getwords')
        fetch('https://localhost:44356/Vocabulary')
        .then(response => response.json())
        .then(data => Asignacion(data))
        .then(data => findDuplicates(data))
        .catch(error => console.log("error API: " + error));

        function Asignacion(data){
            Data = data;
            console.log(Data);
            console.log(Data.length);
        }

        function findDuplicates() {
            var duplicates = [];
            var unique = {};
                for (var i = 0; i < Data.length; i++) {
                    var word = Data[i].word;
                    if (unique[word]) {
                    if (duplicates.indexOf(word) === -1) {
                        duplicates.push(word);
                    }
                    } else {
                    unique[word] = true;
                    }
                }
                return console.log("repeted words: " + duplicates);
            }

        function Intervalo(){
                let random = Math.floor(Math.random() * Data.length);
                let word = Data[random].word;
                Word.innerHTML = word;

                let meaning = Data[random].meaning;
                Meaning.innerHTML = meaning;
            }
        const interval = setInterval(Intervalo,5000);

        function Intervalo2(){
                let random = Math.floor(Math.random() * Data.length);
                let word2 = Data[random].word;
                Word2.innerHTML = word2;

                let meaning2 = Data[random].meaning;
                Meaning2.innerHTML = meaning2;
            }
        const interval2 = setInterval(Intervalo2,1700);
        //////////////////////////////////////////////////////////
        
        const light = document.getElementById("light");
        const savedMode = localStorage.getItem('darkMode');
        if (savedMode === 'true') {
            document.body.classList.add('dark-mode');
            light.checked = true;
        }

        light.addEventListener('change', function () {
            document.body.classList.toggle('dark-mode', this.checked);
            localStorage.setItem('darkMode', this.checked);
        });
    })();

</script>
