<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Círculos Girando</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #111;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .circle-container {
      position: relative;
      width: 200px;
      height: 200px;
    }

    .circle {
      position: absolute;
      /* border-radius: 50%; */
      border: 4px solid #0ff;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      animation-play-state: paused;
    }

    .outer {
      width: 200px;
      height: 200px;
      border-color: #0ff;
      animation: spinRight 3s linear infinite;
    }

    .inner {
      width: 100px;
      height: 100px;
      border-color: #f0f;
      animation: spinLeft 3s linear infinite;
    }

    @keyframes spinRight {
      from { transform: translate(-50%, -50%) rotate(0deg); }
      to { transform: translate(-50%, -50%) rotate(360deg); }
    }

    @keyframes spinLeft {
      from { transform: translate(-50%, -50%) rotate(0deg); }
      to { transform: translate(-50%, -50%) rotate(-360deg); }
    }
  </style>
</head>
<body>
  <div class="circle-container">
    <div class="circle outer"></div>
    <div class="circle inner"></div>
  </div>

  <script>
    const outer = document.querySelector('.outer');
    const inner = document.querySelector('.inner');

    let running = true;

    setInterval(() => {
      running = !running;
      const state = running ? 'running' : 'paused';
      outer.style.animationPlayState = state;
      inner.style.animationPlayState = state;
    }, 3000);
  </script>
</body>
</html>
