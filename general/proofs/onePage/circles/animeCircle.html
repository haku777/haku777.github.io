<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Círculo Mágico Anime</title>
<style>
  body {
    background: #0a0a0a;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
  }

  .magic-circle {
    position: relative;
    width: 300px;
    height: 300px;
    border-radius: 50%;
    animation: spin 10s linear infinite;
    filter: drop-shadow(0 0 10px #00ffff);
  }

  /* Círculo exterior */
  .circle-outer {
    position: absolute;
    top: 10px;
    left: 10px;
    width: 280px;
    height: 280px;
    border: 3px solid #00ffff;
    border-radius: 50%;
    box-shadow:
      0 0 20px #00ffff,
      inset 0 0 15px #00ffff;
  }

  /* Círculo medio */
  .circle-middle {
    position: absolute;
    top: 50px;
    left: 50px;
    width: 200px;
    height: 200px;
    border: 2px dashed #00ffff;
    border-radius: 50%;
    box-shadow:
      0 0 15px #00ffff,
      inset 0 0 10px #00ffff;
  }

  /* Círculo interior */
  .circle-inner {
    position: absolute;
    top: 90px;
    left: 90px;
    width: 120px;
    height: 120px;
    border: 2px dotted #00ffff;
    border-radius: 50%;
    box-shadow: 0 0 10px #00ffff;
  }

  /* Símbolos dentro (simples triángulos) */
  .symbols {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none;
  }

  .symbol {
    position: absolute;
    width: 20px;
    height: 20px;
    border-left: 3px solid #00ffff;
    border-bottom: 3px solid #00ffff;
    transform-origin: center;
    filter: drop-shadow(0 0 3px #00ffff);
  }

  /* Colocamos 8 símbolos alrededor */
  .symbol:nth-child(1) { top: 20px; left: 140px; transform:  rotate(-140deg); }
  .symbol:nth-child(2) { top: 50px; left: 60px; transform: rotate(-180deg); }
  .symbol:nth-child(3) { top: 150px; left: 20px; transform: rotate(130deg); }
  .symbol:nth-child(4) { top: 230px; left: 60px; transform: rotate(90deg); }
  .symbol:nth-child(5) { top: 260px; left: 150px; transform: rotate(40deg); }
  .symbol:nth-child(6) { top: 225px; left: 230px; transform: rotate(0deg); }
  .symbol:nth-child(7) { top: 130px; left: 265px; transform: rotate(-45deg); }
  .symbol:nth-child(8) { top: 55px; left: 225px; transform: rotate(-90deg); }

  /* Centro con brillo */
  .center-glow {
    position: absolute;
    top: 130px;
    left: 130px;
    width: 40px;
    height: 40px;
    background: radial-gradient(circle, #00ffff 30%, transparent 70%);
    border-radius: 50%;
    box-shadow: 0 0 20px #00ffff;
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes spin {
    from { transform: rotate(0deg);}
    to { transform: rotate(360deg);}
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 1;}
    50% { transform: scale(1.3); opacity: 0.7;}
  }
</style>
</head>
<body>

<div class="magic-circle">
  <div class="circle-outer"></div>
  <div class="circle-middle"></div>
  <div class="circle-inner"></div>
  <div class="symbols">
    <div class="symbol"></div>
    <div class="symbol"></div>
    <div class="symbol"></div>
    <div class="symbol"></div>
    <div class="symbol"></div>
    <div class="symbol"></div>
    <div class="symbol"></div>
    <div class="symbol"></div>
  </div>
  <div class="center-glow"></div>
</div>

</body>
</html>
