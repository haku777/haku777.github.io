<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>gyroscope</title>
	<style>
		*{
			margin: 0;
			padding: 0;
			box-sizing: border-box;
			font-family: 'Josefin Sans', sans-serif;
		}
		body{
			background-color: #000;
		}

		main{
			width: 100vw;
			height: 100vh;
			display: flex;
			justify-content: center;
			align-content: center;
			align-items: center;
		}

		.first{
			position: absolute;
			background-color: crimson;
			display: flex;
			justify-content: center;
			align-content: center;
			align-items: center;
			width: 10px;
			height: 32vw;
			z-index: 1000;
		}

		.second{
			position: absolute;
			background-color: salmon;
			display: flex;
			justify-content: center;
			align-content: center;
			align-items: center;
			border-radius: 50%;
			width: 20vw;
			height: 20vw;
			transform: rotatex(75deg);
			z-index: 2000;
		}

		.third{
			position: absolute;
			border:22px solid teal;
			display: flex;
			justify-content: center;
			align-content: center;
			align-items: center;
			border-radius: 50%;
			width: 34vw;
			height: 34vw;
			z-index: 3000;
			animation: third 7s linear infinite;
		}
		.four{
			position: absolute;
			border:24px solid magenta;
			display: flex;
			justify-content: center;
			align-content: center;
			align-items: center;
			border-radius: 50%;
			width: 42vw;
			height: 42vw;
			z-index: 4000;
			animation: four 12s linear infinite;
		}
		
		.five{
			border:24px solid #00d5ff;
			position: absolute;
			display: flex;
			justify-content: center;
			align-content: center;
			align-items: center;
			border-radius: 50%;
			width: 50vw;
			height: 50vw;
			z-index: 5000;
			animation: five 42s linear infinite;
		}
		
		
		@keyframes third{
			from{transform: rotateY(0deg);}
			to	{transform: rotateY(360deg);}
		}
		@keyframes four{
			from{transform: rotateX(0deg);}
			to	{transform: rotateX(360deg);}
		}
		@keyframes five{
			from{transform: rotateX(0deg) rotateY(0deg);}
			to{transform: rotateX(360deg) rotateY(180deg);}
		}

	</style>
</head>
<body>
	<main>
		<div class="five">
			<div class="four">
				<div class="third">
					<div class="second">
						<div class="first"></div>
					</div>
				</div>
			</div>
		</div>
	</main>
</body>
<script>
</script>
</html>
