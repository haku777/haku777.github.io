<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            height: 100vh;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        main{
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-content: center;
            align-items: center;
        }
        .dashboard{
            background: #0b003d;
            padding-top: 7vh;
            width: 18vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: stretch;
        }
        button{
            background: transparent;
            padding: 20px;
            padding-left: 40px;
            text-align: start;
            font-size: 20px;
            color: #fff;
            width: 100%;
            border: none;
            cursor: pointer;
        }
        .active{
            background: crimson;
        }
        section{
            width: 82vw;
            height: 100vh;
        }
        iframe{
            background: #F8F9FA;
            width: 100%;
            height: 100%;
        }
        .dashboard button:hover:not(.active) {
            background-color: rgba(255, 255, 255, 0.1); /* Un brillo sutil */
            padding-left: 15px; /* Un pequeño desplazamiento hacia la derecha */
        }
    </style>
</head>
<body>
    <main>
        <div class="dashboard">
            <button onclick="changeiframe('birthday')">birthday</button>
            <button onclick="changeiframe('pays')">pays</button>
            <button onclick="changeiframe('links')">links</button>
            <button onclick="changeiframe('date')">date</button>
            <button onclick="changeiframe('vitamins')">Vitamins</button>
            <button onclick="changeiframe('dinner')">Dinner</button>
            <button onclick="changeiframe('WordsMeaning')">WordsMeaning</button>
            <button onclick="changeiframe('MentalDisorders')">MentalDisorders</button>
            <button onclick="changeiframe('Sexuality')">Sexual-Illnes</button>
            <button onclick="changeiframe('Solid')">SOLID</button>
        </div>
        <section>
            <iframe src="" frameborder="0"></iframe>
        </section>
    </main>
</body>
<script>

    let iframe = document.querySelector("iframe");
    let buttons = document.querySelectorAll(".dashboard button");
    console.log(buttons[1]);
    function changeiframe(link, element){
        buttons.forEach(btn => btn.classList.remove("active"));
            if (element) {
            element.classList.add("active");
            }
        iframe.src = `${link}/index.html`;
    }
    changeiframe("pays",buttons[1]);
</script>
</html>
