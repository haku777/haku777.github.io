<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="https://haku777.vercel.app/files/img/utilities/yo.ico">
    <link rel="stylesheet" href="css/birthday.css">
    <title>Birthday</title>
</head>
<body>
    <div class="wrapper">
        <h1>Family Galery</h1>
        <h2 class="date" id="date"></h2>
        <main>
            <div class="next" class="change"><</div>
                <div class="card">
                    <div class="percentage">
                        <div class="year">
                            <div class="percent" id="percent"></div>
                        </div>
                    </div>
                </div>
                <div class="information">
                    <fieldset>
                        <legend id="name"></legend>
                            <div class="info">
                                <div class="data">
                                    <p>Birthday: <span id="day"></span>-<span id="month"></span></p>
                                    <p>Age: <span id="age"></span></p>
                                    <p>Year: <span id="year"></span></p>
                                    <p>Zodiac: <span id="zodiac"></span></p>
                                    <p>Element:  <span id="element"></span></p>
                                    <p>Blood: <span id="blood"></span></p>
                                    <p id="daysLeft"></p>
                                </div>

                            </div>
                            <a href="#" onclick="Show()">Show Photos</a>
                    </fieldset>
                </div>
            <div class="next" class="change">></div>
        </main>
        <div class="Photos" id="Photos">
            <div class="close"><a href="#" onclick="Close()">Close</a></div>
            <p id="previewPhoto" class="change"><</p>
            <img id="photo">
            <p id="nextPhoto" class="change">></p>
        </div>
    </div>

</body>
<script src="js/percentage.js"></script>
<script src="js/date.js"></script>
<script src="js/photos.js"></script>
<script src="js/logic.js"></script>
<script src="js/birthday.js"></script>
</html>
