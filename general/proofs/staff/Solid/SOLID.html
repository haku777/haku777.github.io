<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>SOLID</title>
	<style>
		* {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
		}
		body {
			background-color: #f0f0f0;
			font-family: Arial, sans-serif;
			display: flex;
			justify-content: center;
			align-items: center;
			height: 100vh;
			margin: 0;
		}

		.solid, .definition{
			text-align: center;
			display: flex;
			flex-direction: row;
			h2{
				background-color: #007bff;
				padding: 10px;
				word-break: 2px;
				width: 150px;
				color: #fff;;
				border-radius: 4px;
				margin: 0 10px;
			}
			p{
				background-color: salmon;
				margin: 10px 10px;
				color: #fff;
				width: 150px;
			}
		}

		h1 {
			text-align: center;
			color: #333;
			margin-bottom: 20px;
		}
	</style>
</head>
<body>
	<main>
		<h1>SOLID</h1>
		<div class="solid">
			<h2>Single</h2>
			<h2>Open/Close</h2>
			<h2>Lisvok</h2>
			<h2>Interfaces</h2>
			<h2>Dependencys</h2>
		</div>
		<div class="definition">
			<p>singles responsability</p>
			<p>singles responsability</p>
			<p>singles responsability</p>
			<p>singles responsability</p>
			<p>singles responsability</p>
		</div>
	</main>
</body>
</html>
